name: CI

on:
  push:
    branches-ignore:
      - 'v2'

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Go fmt
        run: |
          RES="$(gofmt -s -l .)"
          if [ -n "${RES}" ]
          then
            echo "${RES}"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
      - name: Go Lint
        run: make golang-lint
      - name: C Lint
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          make cpp-lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: make test
      - name: Coverage report
        run: make coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage.html
