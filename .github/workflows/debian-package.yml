name: Build and Publish Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write
    uses: algolia/github-actions/.github/workflows/go-debian-package-s3.yml@08d60f47ef669547f52152fb43bcca1883d17123 # PR #686
    with:
      git-ref: ${{ github.ref }}
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      package-name: openvpn-auth-okta
      go-version: '1.25'
      go-module-path: '.'
      binary-name: openvpn-auth-okta
      cgo-enabled: true
      build-command: make all
      ignore-build-dependencies: true
      s3-prefix: openvpn-auth-okta
      ubuntu-versions: '[{"name": "ubuntu-22.04", "codename": "jammy"}]'
      architectures: '[{"name": "amd64", "go_arch": "amd64"}]'
